# 3일마다 Supabase 를 깨운다 — 무료 플랜은 7일 안 쓰면 멈춘다.
# 레포 Settings → Secrets and variables → Actions 에
# SUPABASE_URL 과 SUPABASE_ANON_KEY 를 넣어야 동작한다.

name: supabase 깨우기

on:
  schedule:
    - cron: '0 3 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: ping() 부르기
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "아직 설정 전이다. 조용히 넘어간다."
            exit 0
          fi
          코드=$(curl -s -o /tmp/응답 -w '%{http_code}' \
            -X POST "$URL/rest/v1/rpc/ping" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json" -d '{}')
          echo "HTTP $코드 — $(cat /tmp/응답)"
          [ "$코드" = "200" ] || { echo "::error::깨우기 실패"; exit 1; }
