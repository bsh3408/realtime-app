<!-- 외계 행성 진화 게임 — 빔 프로젝터 화면
     realtime-app/apps/evolution/board.html
     선생님 진행판(teacher.html)과 따로 씁니다.
     이 화면은 «보여 주기» 만 합니다 — 아무것도 조작하지 않습니다.
     구역을 누르면 그 구역의 외계인들이 돌아다니는 모습이 크게 뜹니다. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>외계 행성 — 빔 화면</title>
<style>
 :root{--bg:#0d1326;--panel:#161d34;--panel2:#101830;--line:#28324f;--ink:#eaf0ff;--sub:#9aa6cc;
       --accent:#7cf0c8;--accent2:#ffd36b;--rec:#ff8fb0;--bad:#ff6b6b}
 *{box-sizing:border-box}
 body{margin:0;background:radial-gradient(120% 80% at 50% -10%,#1c2748 0,transparent 60%),var(--bg);
      color:var(--ink);font-family:system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
      line-height:1.4;overflow-x:hidden}
 .wrap{max-width:2200px;margin:0 auto;padding:12px 16px 16px}

 .top{display:flex;align-items:center;gap:22px;flex-wrap:wrap;margin-bottom:12px}
 .top .t{font-size:22px;font-weight:800;letter-spacing:-.02em}
 .top .m{font-size:13px;color:var(--sub);font-weight:700}
 .top .m b{display:block;color:var(--accent2);font-size:30px;line-height:1.05}
 .top .sp{flex:1}
 .ev{background:rgba(255,107,107,.14);border:1px solid var(--bad);border-radius:12px;
     padding:8px 16px;font-size:15px;font-weight:700}

 /* 판은 화면을 다 쓴다 — 뒤에 앉은 학생이 구역 하나하나를 알아봐야 한다.
    유전자 풀 표는 옆에 늘 펼쳐 두지 않고 «🧬 유전자 풀» 단추로 띄운다 */
 .cols{display:block}
 .panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
 .plabel{font-size:12.5px;color:var(--sub);margin:0 0 10px;font-weight:700}

 /* 보드 */
 /* 판이 화면(가로로 긴 빔)을 꽉 채우게 한다.
    칸을 정사각으로 두면 세로가 모자라 다섯 줄 가운데 셋만 보였다.
    줄 높이를 화면에 맞추면 칸이 가로로 넓어지면서 넓이는 오히려 커진다 */
 .board{display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(5,1fr);
        gap:7px;height:calc(100vh - 182px);min-height:480px}
 .cell{position:relative;border-radius:12px;overflow:hidden;cursor:pointer;
       box-shadow:inset 0 0 0 1px #ffffff18;transition:transform .12s, box-shadow .12s;
       display:flex;flex-direction:column}
 .cell:hover{transform:scale(1.035);box-shadow:inset 0 0 0 2px var(--accent2),0 6px 22px #0007;z-index:3}
 .cell .hd{display:flex;align-items:center;gap:6px;font-size:17px;font-weight:800;
           padding:8px 11px 3px;text-shadow:0 1px 3px #0008}
 .cell .hd .co{opacity:.6;font-size:14px}
 .cell .n{position:absolute;top:8px;right:11px;font-size:19px;font-weight:800;color:#fff;
          background:#0009;border:1px solid #ffffff2e;border-radius:9px;padding:1px 10px}
 .cell .mini{flex:1;display:flex;flex-wrap:wrap;gap:3px;align-content:flex-start;padding:4px 8px 8px}
 .cell .mini img{width:44px;image-rendering:pixelated;display:block}
 .axis{color:var(--sub);font-size:14px;margin:0 2px 8px}
 .cell{border-radius:14px}

 /* 유전자 풀 */
 .sparks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
 table.heat{border-collapse:collapse;font-size:11.5px;width:100%}
 table.heat th,table.heat td{border:1px solid var(--line);padding:4px 5px;text-align:center;
   white-space:nowrap}
 table.heat th{background:var(--panel2);color:var(--sub);font-size:10.5px;font-weight:700}
 table.heat th.bn{text-align:left;font-size:12px;color:var(--ink)}
 table.heat td.v{font-family:ui-monospace,monospace;font-weight:800;color:#fff}
 table.heat td.n{color:var(--sub);font-family:ui-monospace,monospace}
 .sp1{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:8px 9px}
 .sp1 .t{font-size:12px;color:var(--sub);font-weight:700;display:flex;justify-content:space-between}
 .sp1 .t b{color:var(--accent2);font-family:ui-monospace,monospace;font-size:13px}
 .sp1 svg{display:block;width:100%;height:40px;margin-top:3px}

 /* 팝업 */
 .modal{position:fixed;inset:0;background:#060912ee;z-index:90;display:none;
        align-items:center;justify-content:center;padding:26px}
 .modal.on{display:flex}
 .box{background:var(--panel);border:1px solid var(--line);border-radius:20px;
      width:min(1280px,96vw);max-height:94vh;overflow:auto;padding:18px 20px 20px}
 .box .bh{display:flex;align-items:center;gap:14px;margin-bottom:12px;flex-wrap:wrap}
 .box .bh .nm{font-size:26px;font-weight:800}
 .box .bh .sub{color:var(--sub);font-size:14px}
 .box .bh .sp{flex:1}
 .box .bh button{background:var(--panel2);border:1px solid var(--line);color:var(--ink);
                 border-radius:12px;padding:10px 18px;font:inherit;font-size:15px;
                 font-weight:700;cursor:pointer}
 #scene{display:block;width:100%;border-radius:14px;image-rendering:pixelated;background:#111}
 .bars{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:7px;margin-top:14px}
 .bar1{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:7px 9px}
 .bar1 .l{font-size:11.5px;color:var(--sub);display:flex;justify-content:space-between;font-weight:700}
 .bar1 .l b{color:var(--accent2);font-family:ui-monospace,monospace}
 .bar1 .g{height:7px;background:#0c1224;border-radius:5px;overflow:hidden;margin-top:5px}
 .bar1 .g i{display:block;height:100%;background:var(--accent)}
 .bar1.hid .g i{background:var(--accent2)}

 #gate{max-width:420px;margin:80px auto}
 input{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--ink);
       border-radius:11px;padding:12px;font-size:16px;outline:none}
 .btn{background:var(--accent2);color:#3a2a00;border:0;border-radius:12px;padding:13px;
      font:inherit;font-weight:800;font-size:16px;width:100%;margin-top:10px;cursor:pointer}
 .msg{border-radius:10px;padding:9px 12px;font-size:13px;margin-top:10px;
      border:1px solid var(--line);color:var(--sub)}
 .hide{display:none}

 /* ══ 사건 연출 ══════════════════════════════════════════════════
    «7마리 사망» 한 줄로는 아무도 안 놀란다. 반 전체가 같은 순간에
    같은 것을 보고 «어?» 해야 그 다음 이야기가 된다 */
 #boom{position:fixed;inset:0;z-index:200;display:none;pointer-events:none;overflow:hidden}
 #boom.on{display:block;pointer-events:auto}
 #boom .veil{position:absolute;inset:0;background:#000c;animation:veilIn .35s ease-out}
 #boom .flash{position:absolute;inset:0;background:#fff;animation:flash .55s ease-out forwards}
 @keyframes flash{0%{opacity:.92}100%{opacity:0}}
 @keyframes veilIn{from{opacity:0}to{opacity:1}}
 #boom .mid{position:absolute;inset:0;display:flex;flex-direction:column;
            align-items:center;justify-content:center;text-align:center}
 #boom .big{font-size:150px;line-height:1;animation:thump 1.1s cubic-bezier(.2,1.6,.4,1) both}
 @keyframes thump{0%{transform:scale(.1) rotate(-25deg);opacity:0}
                  55%{transform:scale(1.35) rotate(6deg);opacity:1}
                  100%{transform:scale(1) rotate(0)}}
 #boom .nm{font-size:56px;font-weight:800;color:#ffd36b;margin-top:6px;
           text-shadow:0 3px 20px #000;animation:up .5s .25s both}
 #boom .say{font-size:26px;color:#eaf0ff;margin-top:8px;animation:up .5s .45s both}
 #boom .kill{font-size:34px;font-weight:800;margin-top:20px;padding:10px 26px;border-radius:16px;
             background:#ff6b6b22;border:2px solid #ff6b6b;color:#ffb3c4;animation:up .5s .8s both}
 #boom .whr{font-size:20px;color:#9aa6cc;margin-top:12px;animation:up .5s 1s both}
 #boom .tap{font-size:15px;color:#7b86ab;margin-top:26px;animation:up .5s 1.4s both}
 @keyframes up{from{transform:translateY(22px);opacity:0}to{transform:none;opacity:1}}
 #boom.shake .mid{animation:shk .5s 3}
 @keyframes shk{0%,100%{transform:translate(0,0)}20%{transform:translate(-9px,5px)}
                40%{transform:translate(8px,-6px)}60%{transform:translate(-6px,-4px)}
                80%{transform:translate(7px,6px)}}
 #boom i.dot{position:absolute;border-radius:50%;animation:fall linear forwards}
 @keyframes fall{from{transform:translateY(-40px) rotate(0)}
                 to{transform:translateY(105vh) rotate(540deg)}}
 .cell.hit{animation:hit .7s 4}
 @keyframes hit{0%,100%{box-shadow:inset 0 0 0 1px #ffffff18}
                50%{box-shadow:inset 0 0 0 5px #ff6b6b,0 0 30px #ff6b6b}}
</style>

<script src="../../shared/config.js"></script>
<script src="rules.js"></script>
<script src="pix.js"></script>
<script src="net.js"></script>

<div class="wrap">

<section id="gate">
  <div class="panel">
    <div style="font-size:20px;font-weight:800;margin-bottom:4px">빔 화면</div>
    <div class="plabel">선생님 코드를 넣어 주세요.</div>
    <input type="text" id="codeIn" placeholder="코드">
    <button class="btn" id="codeBtn">열기</button>
    <div id="gateMsg"></div>
  </div>
</section>

<section id="main" class="hide">
  <div class="top">
    <div class="t">👽 외계 행성</div>
    <div class="m">세대<b id="tGen">0</b></div>
    <div class="m">지금<b id="tPhase" style="font-size:19px">—</b></div>
    <div class="m">전체 개체<b id="tPop">0</b></div>
    <div class="sp"></div>
    <button id="poolBtn" style="background:var(--panel2);border:1px solid var(--line);
      color:var(--ink);border-radius:11px;padding:9px 15px;font:inherit;font-size:14px;
      font-weight:700;cursor:pointer">🧬 유전자 풀</button>
    <div id="evBox"></div>
  </div>

  <div class="cols">
    <div class="panel">
      <div class="axis">↑건조 · ↓습함 &nbsp;|&nbsp; ←추움 · 더움→ &nbsp;·&nbsp;
        <b style="color:var(--accent2)">구역을 누르면 그 안이 크게 보입니다</b></div>
      <div class="board" id="board"></div>
      <div class="msg" id="envMsg"></div>
    </div>

  </div>
</section>
</div>

<div id="novelBig"></div>
<div id="boom"><div class="veil"></div><div class="flash"></div><div class="mid"></div></div>

<!-- 유전자 풀 팝업 — 판을 가리지 않게 필요할 때만 띄운다 -->
<div class="modal" id="poolModal">
  <div class="box">
    <div class="bh">
      <span class="nm">🧬 환경별 유전자 풀</span>
      <span class="sub">우성 대립유전자 비율(%) · 🔒는 겉모습에 안 드러나는 형질</span>
      <span class="sp"></span>
      <button id="poolClose">닫기 ✕</button>
    </div>
    <div style="overflow-x:auto"><table class="heat" id="heat"></table></div>
    <div class="msg"><b style="color:var(--accent2)">가로로 읽지 말고 세로로 읽으세요.</b>
      같은 형질인데 환경마다 숫자가 반대로 가는 것이 자연선택입니다.
      (반 전체를 합치면 서로 상쇄돼서 아무것도 안 보입니다)</div>
    <details style="margin-top:10px">
      <summary style="cursor:pointer;font-size:12.5px;color:var(--sub);font-weight:700">
        반 전체 합계의 세대별 변화 (참고용 — 대개 평평합니다)</summary>
      <div class="sparks" id="sparks" style="margin-top:8px"></div>
    </details>
  </div>
</div>

<!-- 구역 팝업 -->
<div class="modal" id="modal">
  <div class="box">
    <div class="bh">
      <span class="nm" id="mNm">—</span>
      <span class="sub" id="mSub"></span>
      <span class="sp"></span>
      <button id="mClose">닫기 ✕</button>
    </div>
    <canvas id="scene" width="1180" height="440"></canvas>
    <div id="mDesc"></div>
    <div class="plabel" style="margin:14px 0 0">이 구역의 유전자 풀</div>
    <div class="bars" id="mBars"></div>
  </div>
</div>

<script>
'use strict';
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const CO = (r,c)=> String.fromCharCode(65+r)+(c+1);
let CODE = new URLSearchParams(location.search).get('k') || localStorage.getItem('evoCode') || '';
let T = null, GENES = RULES.GENES;
const biome = k => RULES.바이옴(k);

/* ── 잠금 ── */
$('#codeBtn').onclick = ()=>{ CODE=$('#codeIn').value.trim(); localStorage.setItem('evoCode',CODE); start(); };
if (CODE) start();
else if (window.OFFLINE) $('#gateMsg').innerHTML='<div class="msg">서버 설정을 찾지 못했습니다.</div>';

async function start(){
  const r = await RUN('교사판', CODE).catch(()=>null);
  if(!r || !r.ok){ $('#gateMsg').innerHTML='<div class="msg">코드가 다릅니다.</div>'; return; }
  $('#gate').classList.add('hide'); $('#main').classList.remove('hide');
  T = r; paint();
  setInterval(poll, 3000);
}
let busy=false;
async function poll(){
  if(busy) return; busy=true;
  try{ const r = await RUN('교사판', CODE); if(r && r.ok){ T=r; paint(); } }catch(e){}
  finally{ busy=false; }
}

/* ── 그리기 ── */
let 보드사인='';
function paint(){
  paintNovelBig();
  $('#tGen').textContent = T.turn;
  $('#tPhase').textContent = T.phaseName || '—';
  $('#tPop').textContent = T.총개체;

  const R2 = T.result;
  $('#evBox').innerHTML = (R2 && R2.재해)
    ? '<div class="ev">'+R2.재해.emoji+' <b>'+R2.재해.이름+'</b> — '+R2.재해.말
      +' &nbsp;<span style="color:var(--bad)">'+R2.재해.죽음+'마리 사망</span></div>'
    : '';

  const e = T.env||{dt:0,dm:0};
  $('#envMsg').innerHTML = '기후 이동 — 온도 <b style="color:var(--accent2)">'+(e.dt>0?'+':'')+e.dt.toFixed(2)
    +'</b> · 습도 <b style="color:var(--accent2)">'+(e.dm>0?'+':'')+e.dm.toFixed(2)+'</b>'
    + (T.forecast ? ' &nbsp;·&nbsp; 📡 다음 예보 <b style="color:var(--accent2)">'+T.forecast+'</b>' : '');

  // 판이 그대로면 다시 그리지 않는다 — 빔이 깜빡인다
  const sig = JSON.stringify([T.board, T.cells.map(c=>c.list.length), T.turn]);
  if (sig !== 보드사인) { 보드사인 = sig; paintBoard(); }
  if ($('#poolModal').classList.contains('on')) { paintHeat(); paintSparks(); }
  if (모달칸) 팝업그리기(모달칸.r, 모달칸.c, true);
  사건연출();
}

/* ══ 사건 연출 ══════════════════════════════════════════════════ */
let 본사건 = null;
const 사건색 = { volcano:['#ff7a3d','#ffd36b'], meteor:['#c9a37a','#ff9c6b'],
                 quake:['#a08b6b','#d9c39a'], sink:['#4aa3e0','#9fd8ff'],
                 rise:['#8a8f9a','#cbd3e0'], hunter:['#8b5cf6','#22d3ee'] };
function 사건연출(){
  const D = T.result && T.result.재해;
  if(!D){ return; }
  const 열쇠 = T.turn + ':' + D.이름 + ':' + D.죽음;
  if(본사건 === 열쇠) return;
  본사건 = 열쇠;

  const box = $('#boom'), mid = box.querySelector('.mid');
  const 칸글 = (D.칸들||[]).map(x=>CO(x.r,x.c)).join(' · ');
  mid.innerHTML = '<div class="big">'+D.emoji+'</div>'
    + '<div class="nm">'+D.이름+'</div>'
    + '<div class="say">'+D.말+'</div>'
    + '<div class="kill">'+D.죽음+'마리 사망 &nbsp;·&nbsp; '+(D.살아남음||0)+'마리 생존</div>'
    + (칸글 ? '<div class="whr">덮친 구역 &nbsp;'+칸글+'</div>' : '')
    + '<div class="whr">살아남은 것들은 무엇을 가지고 있었을까요?</div>'
    + '<div class="tap">아무 곳이나 누르면 닫힙니다</div>';

  // 떨어지는 것들 — 사건마다 색을 달리해 «무슨 일인지» 가 색으로도 온다
  const 색 = 사건색[D.k] || 사건색.quake;
  box.querySelectorAll('i.dot').forEach(e=>e.remove());
  for(let i=0;i<70;i++){
    const d = document.createElement('i'); d.className='dot';
    const sz = 4+Math.random()*13;
    d.style.cssText = 'width:'+sz+'px;height:'+sz+'px;left:'+(Math.random()*100)+'vw;'
      + 'background:'+색[i%2]+';opacity:'+(0.35+Math.random()*0.5)
      + ';animation-duration:'+(1.6+Math.random()*2.4)+'s;animation-delay:'+(Math.random()*1.2)+'s';
    box.appendChild(d);
  }
  box.classList.add('on');
  box.classList.toggle('shake', D.k==='quake' || D.k==='volcano' || D.k==='meteor');
  // 판에서도 맞은 칸이 깜빡인다
  (D.칸들||[]).forEach(x=>{
    const el = $$('#board .cell')[x.r*5+x.c];
    if(el){ el.classList.add('hit'); setTimeout(()=>el.classList.remove('hit'), 3200); }
  });
  const 끄기 = ()=>{ box.classList.remove('on'); box.onclick=null; };
  box.onclick = 끄기;
  setTimeout(끄기, 9000);
}

function paintBoard(){
  const bd = $('#board'); bd.innerHTML='';
  for(let r=0;r<5;r++) for(let c=0;c<5;c++){
    const b = biome(T.board[r][c]);
    const cell = T.cells[r*5+c];
    const el = document.createElement('div');
    el.className = 'cell' + (cell.list.length ? '' : ' empty');
    el.style.background = b.bg; el.style.color = b.ink;
    let h = '<div class="hd"><span class="co">'+CO(r,c)+'</span><span>'+b.emoji+'</span>'
          + '<span>'+b.name+'</span></div>';
    if (cell.list.length) h += '<div class="n">'+cell.list.length+'</div>';
    h += '<div class="mini">'
      + cell.list.slice(0,24).map(a=>'<img src="'+sprite(a.ph)+'">').join('')
      + '</div>';
    el.innerHTML = h;
    el.onclick = ()=> 팝업열기(r,c);
    bd.appendChild(el);
  }
}

/* 구역별 유전자 풀 — 교사판이 준 겉모습으로는 못 구하니 개체 원본을 쓴다 */
function 구역빈도(r,c){
  const A = (T._aliens||[]).filter(a=>a.alive && a.r===r && a.c===c);
  return RULES.빈도(A);
}

/* 환경별 유전자 풀 — 같은 형질이 환경마다 반대로 가는 것을 나란히 보여 준다.
   반 전체를 합치면 서로 상쇄돼서 12세대를 돌려도 50%에서 안 움직인다.
   구역별로 나누면 20%p 넘게 벌어진다 — 자연선택이 보이는 건 이쪽이다. */
function paintHeat(){
  const A = T._aliens || [];
  // 바이옴별로 개체를 모은다
  const 통 = {};
  for(let r=0;r<5;r++) for(let c=0;c<5;c++){
    const k = T.board[r][c];
    if(!통[k]) 통[k]=[];
    A.forEach(a=>{ if(a.alive && a.r===r && a.c===c) 통[k].push(a); });
  }
  const 있는것 = RULES.BIOMES.filter(b=>통[b.key] && 통[b.key].length>0);
  if(!있는것.length){ $('#heat').innerHTML='<tr><td>아직 개체가 없습니다.</td></tr>'; return; }

  let h = '<tr><th class="bn">환경</th><th>마리</th>'
        + GENES.map(G=>'<th>'+(G.보임?'':'🔒')+G.n+'</th>').join('') + '</tr>';
  있는것.forEach(b=>{
    const f = RULES.빈도(통[b.key]);
    h += '<tr><th class="bn">'+b.emoji+' '+b.name+'</th><td class="n">'+f.n+'</td>'
      + GENES.map(G=>{
          const v = f.f[G.k];
          // 50에서 얼마나 벗어났나로 색을 준다 — 치우친 칸이 눈에 띈다
          const d = (v-50)/50;
          const bg = d>=0 ? 'rgba(124,240,200,'+(Math.abs(d)*0.55).toFixed(2)+')'
                          : 'rgba(255,143,176,'+(Math.abs(d)*0.55).toFixed(2)+')';
          return '<td class="v" style="background:'+bg+'">'+v+'</td>';
        }).join('') + '</tr>';
  });
  $('#heat').innerHTML = h;
}

function paintSparks(){
  const rows = T.hist || [];
  $('#sparks').innerHTML = GENES.map(G=>{
    const vals = rows.map(x=>x.f[G.k]).filter(v=>v!=null);
    const last = vals.length ? vals[vals.length-1] : 0;
    let path='';
    if (vals.length>1) path = vals.map((v,i)=>{
      const x = i/(vals.length-1)*96+2, y = 36-(v/100)*32;
      return (i?'L':'M')+x.toFixed(1)+','+y.toFixed(1);
    }).join(' ');
    return '<div class="sp1"><div class="t"><span>'+(G.보임?'':'🔒 ')+G.n+'</span><b>'+last+'%</b></div>'
      +'<svg viewBox="0 0 100 40" preserveAspectRatio="none">'
      +'<line x1="0" y1="20" x2="100" y2="20" stroke="#28324f" stroke-width="1"/>'
      +(path?'<path d="'+path+'" fill="none" stroke="'+(G.보임?'#7cf0c8':'#ffd36b')
        +'" stroke-width="2.2" vector-effect="non-scaling-stroke"/>':'')
      +'</svg></div>';
  }).join('');
}

/* ══ 구역 팝업 — 외계인들이 돌아다닌다 ══════════════════════════ */
let 모달칸 = null, 배우 = [], 애니 = null, 그림장 = {}, 정면장 = {};

/* 없던 형질 — 빔 화면에서 제일 크게 보여야 한다.
   이 순간을 반 전체가 함께 봐야 «변이가 먼저, 선택은 그 다음» 이 남는다 */
function paintNovelBig(){
  const 방금 = (T.result && T.result.새형질) || [], 지금 = T.새형질 || [];
  const box = $('#novelBig');
  if(!방금.length && !지금.length){ box.innerHTML=''; return; }
  box.innerHTML =
    '<div style="background:linear-gradient(135deg,#2b1b4d,#123a2c);border:2px solid #ffd36b;'
    + 'border-radius:16px;padding:16px 20px;margin:0 0 14px">'
    + (방금.length
        ? '<div style="font-size:30px;font-weight:800;color:#ffd36b;line-height:1.25">'
          + 방금.map(x=>x.emoji+' '+x.이름).join(' · ') + ' — 없던 형질이 나타났습니다!</div>'
          + '<div style="font-size:19px;margin-top:6px">'
          + 방금.map(x=>'<b style="color:#7cf0c8">'+x.누구+'</b> 님의 <b>'+x.칸+'</b> 구역'
              + (x.마리>1 ? ' · 한배 '+x.마리+'마리' : '')).join(' &nbsp;/&nbsp; ')
          + '</div>'
          + '<div style="font-size:16px;color:#9aa6cc;margin-top:6px">'
          + '어버이 둘 다 이 형질이 없었습니다. 유전자가 베껴지다 틀린 것입니다.</div>'
        : '<div style="font-size:22px;font-weight:800;color:#ffd36b">돌연변이로 나타난 형질</div>')
    + (지금.length
        ? '<div style="font-size:20px;margin-top:8px">'
          + 지금.map(x=>x.emoji+' <b>'+x.이름+'</b> '+x.마리+'마리 <span style="color:#9aa6cc;font-size:16px">('
            + x.사람수+'명)</span>').join(' &nbsp;·&nbsp; ') + '</div>'
        : '<div style="font-size:18px;color:#9aa6cc;margin-top:8px">지금은 남아 있는 개체가 없습니다 — 나타났다가 사라졌습니다.</div>')
    + '</div>';
}

function 팝업열기(r,c){
  모달칸 = {r,c};
  $('#modal').classList.add('on');
  팝업그리기(r,c,false);
  if(!애니) 돌리기();
}
$('#poolBtn').onclick = ()=>{ $('#poolModal').classList.add('on'); paintHeat(); paintSparks(); };
$('#poolClose').onclick = ()=> $('#poolModal').classList.remove('on');
$('#poolModal').onclick = e => { if(e.target.id==='poolModal') $('#poolModal').classList.remove('on'); };

$('#mClose').onclick = 닫기;
$('#modal').onclick = e => { if(e.target.id==='modal') 닫기(); };
addEventListener('keydown', e => { if(e.key==='Escape'){ 닫기(); $('#poolModal').classList.remove('on'); } });
function 닫기(){
  모달칸=null; $('#modal').classList.remove('on');
  if(애니){ cancelAnimationFrame(애니); 애니=null; }
}

function 팝업그리기(r,c,조용히){
  const b = biome(T.board[r][c]);
  const list = T.cells[r*5+c].list;
  $('#mNm').textContent = b.emoji + ' ' + b.name + ' — ' + CO(r,c);
  $('#mSub').textContent = list.length ? (list.length + '마리가 살고 있습니다') : '아무도 없습니다';
  /* 구역 설명 — 무엇이 유리한지는 말하지 않는다. 어떤 곳인지만 적는다.
     빔으로 크게 띄워 놓고 반 전체가 같이 읽으며 추리하는 자리다 */
  $('#mDesc').innerHTML = b.설명
    ? '<div style="margin:14px 0 0;padding:12px 14px;background:#0f1626;border:1px solid #26314d;'
      +'border-radius:12px;font-size:17px;line-height:1.85">'+b.설명+'</div>'
    : '';

  // 배우 만들기 (개체가 바뀌었을 때만 새로)
  const key = list.map(a=>a.sid+a.ph).join('|');
  if (key !== 배우키) {
    배우키 = key;
    const cv = $('#scene');
    배우 = list.map((a,i)=>{
      // 옆모습 걷기 네 장. 앞모습과 «같은 겉모습 열두 자리» 로 그린다
      if(!그림장[a.ph]) 그림장[a.ph] = PIX.걷기(a.ph);
      if(!정면장[a.ph]) { const im=new Image(); im.src = sprite(a.ph); 정면장[a.ph] = im; }
      return { ph:a.ph, name:a.name,
        x: 60 + Math.random()*(cv.width-200),
        y: 150 + Math.random()*(cv.height-230),
        dir: Math.random()<0.5?-1:1,
        spd: 0.25 + Math.random()*0.75,
        ph2: Math.random()*6, 쉼: 0, 쉼전체: 1 };
    });
  }

  // 이 구역의 유전자 풀
  const f = 구역빈도(r,c);
  $('#mBars').innerHTML = f.n
    ? GENES.map(G=>'<div class="bar1'+(G.보임?'':' hid')+'"><div class="l"><span>'
        +(G.보임?'':'🔒 ')+G.n+'</span><b>'+f.f[G.k]+'%</b></div>'
        +'<div class="g"><i style="width:'+f.f[G.k]+'%"></i></div></div>').join('')
    : '<div class="msg">개체가 없어 유전자 풀이 없습니다.</div>';
}
let 배우키 = '';

function 돌리기(){
  const cv = $('#scene'), ctx = cv.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  function 한장(){
    if(!모달칸){ 애니=null; return; }
    const b = biome(T.board[모달칸.r][모달칸.c]);
    // 바탕
    const g = ctx.createLinearGradient(0,0,0,cv.height);
    g.addColorStop(0, b.bg); g.addColorStop(1, '#0b0f1a');
    ctx.fillStyle = g; ctx.fillRect(0,0,cv.width,cv.height);
    ctx.fillStyle = '#00000014';
    for(let y=cv.height*0.42; y<cv.height; y+=16) ctx.fillRect(0,y,cv.width,5);

    // 뒤에 있는 것부터
    const 정렬 = 배우.slice().sort((p,q)=>p.y-q.y);
    for(const a of 정렬){
      // 걷기
      a.쉼 = a.쉼>0 ? a.쉼-1 : 0;
      if(!a.쉼){
        a.x += a.dir*a.spd; a.ph2 += 0.12;
        if(a.x < 30){ a.x=30; a.dir=1; }
        if(a.x > cv.width-130){ a.x=cv.width-130; a.dir=-1; }
        if(Math.random()<0.006){ a.dir*=-1; }
        if(Math.random()<0.006){ a.쉼전체 = 45+Math.random()*80; a.쉼 = a.쉼전체; }
        if(Math.random()<0.008){ a.y = Math.max(140, Math.min(cv.height-90, a.y+(Math.random()-0.5)*40)); }
      }
      /* 멈춰 서면 이쪽을 돌아본다 — 앞모습으로 바꾼다.
         옆모습만 계속 쓰면 겉모습의 절반(눈 크기·더듬이·뿔의 좌우 대칭)이
         안 보인다. 걸을 때는 옆, 서면 정면 — 그래야 둘 다 눈에 들어온다.
         돌아서는 동안(쉼의 처음·끝 몇 프레임)에는 가로로 눌러 «도는 것» 처럼 */
      const 장 = 그림장[a.ph];
      if(!장) continue;
      const 정면 = 정면장[a.ph];
      const 서있음 = a.쉼 > 0 && 정면 && 정면.complete && 정면.naturalWidth;
      const 도는중 = a.쉼 > 0 && (a.쉼 > a.쉼전체-8 || a.쉼 < 8);
      let im, s, sh, 납작 = 1;
      if (서있음) {
        im = 정면;                       // 앞모습 120 × 128
        s = 78; sh = s * (PIX.H / PIX.W);
        if (도는중) 납작 = 0.45;
      } else {
        im = 장[Math.floor(a.ph2*1.6) % 4];   // 옆모습 112 × 88
        s = 104; sh = s * (PIX.SH / PIX.SW);
      }
      if(!im || !im.complete || !im.naturalWidth) continue;
      const bob = a.쉼 ? 0 : Math.sin(a.ph2*2)*1.5;
      // 발이 같은 높이에 닿게 — 앞모습이 더 길어서 그냥 그리면 붕 뜬다
      const 발높이 = 104 * (PIX.SH / PIX.SW);
      const dy = a.y + bob + (발높이 - sh);
      const dx = a.x + (104 - s*납작)/2;
      ctx.save();
      // 그림자
      ctx.fillStyle='#0004';
      ctx.beginPath(); ctx.ellipse(a.x+52, a.y+발높이*0.95, 23, 5, 0, 0, 6.3); ctx.fill();
      if(!서있음 && a.dir<0){ ctx.translate(a.x+s, a.y+bob); ctx.scale(-1,1); ctx.drawImage(im,0,0,s,sh); }
      else ctx.drawImage(im, dx, dy, s*납작, sh);
      ctx.restore();
      // 이름표
      ctx.font='bold 13px system-ui'; ctx.textAlign='center';
      const nx=a.x+52, ny=dy-6;
      const w=ctx.measureText(a.name).width+12;
      ctx.fillStyle='#000000aa'; ctx.fillRect(nx-w/2, ny-14, w, 18);
      ctx.fillStyle='#fff'; ctx.fillText(a.name, nx, ny);
    }
    if(!배우.length){
      ctx.fillStyle='#ffffff66'; ctx.font='bold 22px system-ui'; ctx.textAlign='center';
      ctx.fillText('이 구역에는 아무도 살지 않습니다', cv.width/2, cv.height/2);
    }
    애니 = requestAnimationFrame(한장);
  }
  한장();
}
</script>
